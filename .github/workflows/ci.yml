name: Build and test
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
permissions:
  contents: read
jobs:
  changes:
    name: Determine change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-classify-changes.sh
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Real engines, installed the way a Windows user would (off PATH for
      # ImageMagick and Pandoc), so engine discovery and conversions are tested.
      - if: runner.os == 'Windows'
        run: choco install -y --no-progress pandoc imagemagick ffmpeg
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ matrix.os }}
          path: |
            target/release/lorenz
            target/release/lorenz.exe
  linux-families:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'debian:testing', 'archlinux:latest', 'fedora:latest', 'fedora:rawhide']
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools and optional engines
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y curl ca-certificates build-essential git ffmpeg imagemagick pandoc poppler-utils qpdf ghostscript libarchive-tools
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed base-devel curl git ffmpeg imagemagick pandoc-cli poppler qpdf ghostscript libarchive
          else
            dnf install -y gcc gcc-c++ make curl git ffmpeg-free ImageMagick pandoc poppler-utils qpdf ghostscript bsdtar
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo run --locked -- doctor
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: QT_QPA_PLATFORM=offscreen build/lorenz-desktop --smoke-test
      # Frames of the wheel (open, magnify, switch) for visual review.
      - run: |
          for look in light dark; do
            QT_QPA_PLATFORM=offscreen LORENZ_THEME=$look LORENZ_WHEEL_BACKDROP=tests/fixtures/wallpaper-$look.jpg \
              LORENZ_WHEEL_FRAMES=wheel-frames/$look build/lorenz-wheel-test
          done
          QT_QPA_PLATFORM=offscreen LORENZ_THEME=light LORENZ_WHEEL_BACKDROP=tests/fixtures/demo-backdrop-light.jpg \
            LORENZ_WHEEL_DEMO=wheel-frames/demo build/lorenz-wheel-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-frames
          path: wheel-frames
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          cache: true
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      # lorenz-desktop is a windowed program: PowerShell does not wait for it.
      - shell: pwsh
        run: |
          windeployqt --release build/Release/lorenz-desktop.exe
          $env:QT_QPA_PLATFORM = 'offscreen'
          $run = Start-Process build/Release/lorenz-desktop.exe --smoke-test -Wait -PassThru
          if ($run.ExitCode) { throw "smoke test failed: $($run.ExitCode)" }
      # The installer people download: Lorenz-Setup-x64.exe.
      # Qt is bundled under the LGPL: its license and the crates' notices go in.
      - name: Third-party notices
        shell: bash
        run: |
          mkdir -p dist/Lorenz
          packaging/licenses/notices.sh dist/Lorenz/THIRD-PARTY-NOTICES.txt x86_64-pc-windows-msvc
      - name: Build the Windows installer
        shell: pwsh
        run: |
          cargo build --release --locked
          $root = 'dist/Lorenz'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item target/release/lorenz.exe, build/Release/lorenz-desktop.exe $root
          windeployqt --release --no-translations "$root/lorenz-desktop.exe"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          choco install -y --no-progress innosetup
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging/windows/lorenz.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }
      - name: Install and uninstall silently
        shell: pwsh
        run: |
          $setup = Start-Process dist/Lorenz-Setup-x64.exe -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', '/LANG=fr', '/LOG=setup.log'
          if ($setup.ExitCode) { Get-Content setup.log; throw "setup failed: $($setup.ExitCode)" }
          if (-not (Select-String -Quiet -Path (Join-Path $env:LOCALAPPDATA 'lorenz\lorenz.conf') -Pattern '^Language=fr')) { throw 'the setup language was not passed to the app' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Lorenz'
          foreach ($file in 'lorenz.exe', 'lorenz-desktop.exe', 'Qt6Core.dll', 'platforms\qwindows.dll', 'unins000.exe', 'LICENSE.txt', 'LGPL-3.0.txt', 'THIRD-PARTY-NOTICES.txt') {
              if (-not (Test-Path (Join-Path $installed $file))) { throw "missing $file" }
          }
          foreach ($folder in 'SendTo', 'Programs', 'Desktop') {
              $link = Join-Path ([Environment]::GetFolderPath($folder)) 'Lorenz.lnk'
              if (-not (Test-Path $link)) { throw "missing $link" }
          }
          if ((& "$installed\lorenz.exe" autostart status) -ne 'disabled') { throw 'autostart enabled without its task' }
          & "$installed\lorenz.exe" doctor
          if ($LASTEXITCODE) { throw 'doctor failed' }
          # The uninstaller restarts itself from a temporary copy and returns at once.
          Start-Process "$installed\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 60 -and (Test-Path "$installed\lorenz.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$installed\lorenz.exe") { throw 'uninstall left files' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Lorenz.lnk')) { throw 'uninstall left the desktop shortcut' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: dist/Lorenz-Setup-x64.exe

  # Each package is built in the distribution it targets, then installed in
  # clean containers by linux-package-install.
  linux-package:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, image: 'debian:12' }
          - { format: rpm, image: 'fedora:latest' }
          - { format: arch, image: 'archlinux:latest' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash packaging/linux/build-package.sh ${{ matrix.format }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.format }}
          path: dist/*
  linux-package-install:
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') && needs.linux-package.result == 'success' }}
    needs: [changes, linux-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, image: 'debian:12' }
          - { format: deb, image: 'debian:stable' }
          - { format: deb, image: 'ubuntu:24.04' }
          - { format: rpm, image: 'fedora:latest' }
          - { format: arch, image: 'archlinux:latest' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.format }}
          path: dist
      - run: bash packaging/linux/test-package.sh $(ls dist/*.deb dist/*.rpm dist/*.pkg.tar.zst 2>/dev/null)
  # The crates for offline builds from source: Fedora COPR and the Ubuntu PPA
  # download this archive from the release.
  vendor:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sh packaging/linux/vendor.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-vendor
          path: dist/lorenz-*-vendor.tar.xz
  # packaging/fedora/lorenz.spec, as COPR builds it: from the sources, offline.
  fedora-spec:
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') && needs.vendor.result == 'success' }}
    needs: [changes, vendor]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y git rpm-build dnf-plugins-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-vendor
          path: dist
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          sed -i "s/^Version: .*/Version:        $version/" packaging/fedora/lorenz.spec
          mkdir -p ~/rpmbuild/SOURCES
          git config --global --add safe.directory "$PWD"
          git archive --prefix="Lorenz-$version/" -o ~/rpmbuild/SOURCES/Lorenz-$version.tar.gz HEAD
          cp dist/lorenz-*-vendor.tar.xz ~/rpmbuild/SOURCES/
          dnf builddep -y packaging/fedora/lorenz.spec
          rpmbuild -bb packaging/fedora/lorenz.spec
          bash packaging/linux/test-package.sh ~/rpmbuild/RPMS/x86_64/lorenz-$version-*.x86_64.rpm
  # Built on the oldest supported base: an AppImage runs on newer systems only.
  appimage:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          cache: true
      # Libraries the Qt xcb plugin loads; linuxdeploy bundles them from here.
      - run: >-
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - run: bash packaging/linux/build-appimage.sh
      - run: |
          QT_QPA_PLATFORM=offscreen dist/Lorenz-x86_64.AppImage --appimage-extract-and-run --smoke-test
          cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/dist/Lorenz-x86_64.AppImage" --appimage-extract >/dev/null
          squashfs-root/usr/bin/lorenz --version
          for file in LICENSE LGPL-3.0.txt THIRD-PARTY-NOTICES.txt; do
            test -s "squashfs-root/usr/share/licenses/lorenz/$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-appimage
          path: dist/Lorenz-x86_64.AppImage

  # Only this job may write, and it runs no build code: it publishes the
  # packages that the jobs above built and tested.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, linux-package-install, appimage, vendor, fedora-spec]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # SHA256SUMS lets users check a download (docs/VERIFYING.md).
        run: |
          (cd dist && sha256sum -- * >SHA256SUMS)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      # Fedora COPR rebuilds from the release just published (.copr/Makefile).
      - env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: curl -fsS -X POST "$COPR_WEBHOOK"

  # The Ubuntu PPA and the AUR follow each release; both download the
  # release just published. Debian's apt repository (Chaos-Tic/apt) picks the
  # .deb up within the hour.
  ppa:
    needs: release
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          PPA_SIGNING_KEY: ${{ secrets.PPA_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: bash packaging/debian/ppa.sh "${TAG#v}"
  aur:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: bash packaging/arch/aur.sh "${TAG#v}"

  installer:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/test-install-container.sh ${{ matrix.image }}

  kwin-extension:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel cmake git curl kwin extra-cmake-modules vulkan-headers
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/build-kwin.sh
