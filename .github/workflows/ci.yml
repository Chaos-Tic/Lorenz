name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Real engines, installed the way a Windows user would (off PATH for
      # ImageMagick and Pandoc), so engine discovery and conversions are tested.
      - if: runner.os == 'Windows'
        run: choco install -y --no-progress pandoc imagemagick ffmpeg
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.os }}
          path: |
            target/release/metroid
            target/release/metroid.exe
  linux-families:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'debian:testing', 'archlinux:latest', 'fedora:latest', 'fedora:rawhide']
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools and optional engines
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y curl ca-certificates build-essential git ffmpeg imagemagick pandoc poppler-utils qpdf ghostscript libarchive-tools
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed base-devel curl git ffmpeg imagemagick pandoc-cli poppler qpdf ghostscript libarchive
          else
            dnf install -y gcc gcc-c++ make curl git ffmpeg-free ImageMagick pandoc poppler-utils qpdf ghostscript bsdtar
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo run --locked -- doctor
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: QT_QPA_PLATFORM=offscreen build/metroid-desktop --smoke-test
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.3'
          cache: true
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - shell: pwsh
        run: |
          windeployqt --release build/Release/metroid-desktop.exe
          $env:QT_QPA_PLATFORM = 'offscreen'
          build/Release/metroid-desktop.exe --smoke-test
      # The ready-to-install package: unzip, double-click Install.cmd.
      - name: Build the Windows package
        shell: pwsh
        run: |
          cargo build --release --locked
          $root = 'dist/Metroid'
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item target/release/metroid.exe, build/Release/metroid-desktop.exe "$root/bin"
          windeployqt --release --no-translations "$root/bin/metroid-desktop.exe"
          Copy-Item scripts/install-windows.ps1 "$root/install.ps1"
          Copy-Item scripts/uninstall-windows.ps1 "$root/uninstall.ps1"
          Copy-Item packaging/windows/*.cmd $root
          Compress-Archive -Path $root -DestinationPath dist/Metroid-windows-x64.zip
      - name: Install and uninstall the package
        shell: pwsh
        run: |
          Expand-Archive dist/Metroid-windows-x64.zip test-install
          powershell -NoProfile -ExecutionPolicy Bypass -File test-install/Metroid/install.ps1 -NoEngines -NoOffice -NoAutostart
          if ($LASTEXITCODE) { throw 'install failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Metroid'
          foreach ($file in 'metroid.exe', 'metroid-desktop.exe', 'Qt6Core.dll', 'platforms\qwindows.dll') {
              if (-not (Test-Path (Join-Path $installed $file))) { throw "missing $file" }
          }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('SendTo')) 'Metroid.lnk'))) { throw 'missing Send to entry' }
          & "$installed\metroid.exe" autostart status
          & "$installed\metroid.exe" doctor
          if ($LASTEXITCODE) { throw 'doctor failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File test-install/Metroid/uninstall.ps1
          if (Test-Path $installed) { throw 'uninstall left files' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Metroid-windows-x64
          path: dist/Metroid-windows-x64.zip

  # Only this job may write, and it runs no build code: it publishes the
  # package that desktop-windows built and tested.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Metroid-windows-x64
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" Metroid-windows-x64.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  installer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/test-install-container.sh ${{ matrix.image }}

  kwin-extension:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel cmake git curl kwin extra-cmake-modules vulkan-headers
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/build-kwin.sh
