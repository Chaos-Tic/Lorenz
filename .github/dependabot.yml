version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # All github/codeql-action steps must run the same version; bump them as one
    # PR so init and analyze never land on mismatched versions.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
