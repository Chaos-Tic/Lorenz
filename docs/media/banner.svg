<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Metroid — A lighter way to convert.</title>
<desc id="desc">Graphite and mint identity with a floating conversion orbit.</desc>
