<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<circle cx="1000" cy="140" r="220" fill="url(#glow)"/>
<g fill="none" stroke="#b6e8d6" stroke-width="15" stroke-linecap="round"><path d="M1056 125A62 62 0 0 0 988 79"/><path d="M950 103A62 62 0 0 0 956 191"/><path d="M983 205A62 62 0 0 0 1057 154"/></g><circle cx="998" cy="143" r="17" fill="#edf3f1"/>
<g font-family="Inter,DejaVu Sans,Arial,sans-serif">
