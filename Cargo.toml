[package]
name = "lorenz"
version = "1.2.0"
edition = "2024"
description = "Local file conversion for Linux and Windows"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
